experiment_name: information_gain_controls
result_root: results/experiment_11_information_gain
plot_style_config: configs/figure_style.yaml
experiment_05_root: results/experiment_05_state_scores

analysis:
  top_k: 8
  display_top_per_method: 4
  rank_displacement_states: 5
  correlation_bootstrap_replicates: 400
  quadrant_quantile: 0.75
  max_scatter_states_per_cohort: 360
  ci_reference: 1.0
random_seed: 20260628

datasets:
  AACR_LUAD:
    display_name: Lung adenocarcinoma
    short_name: LUAD
  AACR_COAD:
    display_name: Colon adenocarcinoma
    short_name: COAD
  AACR_IDC:
    display_name: Breast invasive ductal carcinoma
    short_name: IDC

methods:
  mhn_only:
    display_name: MHN-only
    score_column: F_hat
    interpretation: model-derived expected inflow
  occupancy_only:
    display_name: Occupancy-only
    score_column: L_v
    interpretation: observed cross-sectional occupancy
  rel_obstq_mhn:
    display_name: Rel-ObsTQ-MHN
    score_column: R_star
    interpretation: occupancy divided by model-derived inflow

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600
