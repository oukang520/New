experiment_name: mhn_to_relobstq_interface
result_root: results/experiment_03_mhn_interface
plot_style_config: configs/figure_style.yaml
experiments_01_02_root: results/experiments_01_02
random_seed: 20260624
panel_size: 15

mhn:
  model_type: cMHN
  penalty: L1
  device: CPU
  cv_folds: 5
  lambda_multipliers: [0.1, 0.316227766, 1.0, 3.16227766, 10.0]
  pick_1se: true
  expand_boundary_grid: true
  max_grid_expansions: 3
  max_iterations: 5000
  relative_tolerance: 1.0e-7

transition:
  source_genotypes: observed_only
  target_genotypes: one_event_addition
  stage_rule: same_stage_genotype_transition
  usable_stages: [early, local_advanced, primary, metastatic]

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600
  top_genotypes: 18
  top_edges: 16
