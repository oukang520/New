  AACR_IDC:
    display_name: Breast invasive ductal carcinoma
    short_name: IDC
    expected_modules: [hormone/luminal, PI3K-AKT, DNA repair, p53/genome integrity]

modules:
  - RTK-MAPK
  - p53/genome integrity
  - WNT
  - TGF-beta
  - PI3K-AKT
  - hormone/luminal
  - DNA repair
  - cell cycle
  - chromatin
  - stress/metabolism

