  AACR_COAD:
    display_name: Colon adenocarcinoma
    short_name: COAD
  AACR_IDC:
    display_name: Breast invasive ductal carcinoma
    short_name: IDC

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600
