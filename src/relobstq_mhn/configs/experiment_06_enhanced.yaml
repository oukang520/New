experiment_name: foundational_bottleneck_recovery_enhanced
result_root: results/experiment_06_bottleneck_recovery_enhanced
plot_style_config: configs/figure_style.yaml
random_seed: 20260625

simulation:
  samples_per_repeat: 1000
  events: 15
  repeats: 100
  pilot_samples: 30000
  maximum_events: 8
  maximum_time: 10.0
  random_interaction_sparsity_before_scaffold: 0.10
  topology_label: moderate_sparse_scaffolded_stress_test
  bottleneck_states: 3
  fast_states: 3
  bottleneck_dwell: 3.0
  fast_dwell: 0.3
  neutral_dwell: 1.0
  observation_weight: 1.0
  false_positive_rate: 0.0
  false_negative_rate: 0.0
  stage_missing_rate: 0.0

truth_selection:
  mode: positive_control_inflow_confounded_stress_test
  bottleneck_event_count_min: 2
  bottleneck_event_count_max: 4
  bottleneck_pilot_count_min: 45
  bottleneck_pilot_count_max: 140
  bottleneck_target_pilot_count: 85
  fast_event_count_min: 1
  fast_event_count_max: 2
  fast_pilot_count_min: 200
  stage_stratified: true

lambda_calibration:
  independent_calibration_cohort: true
  seed_offset: 2000

mhn:
  lambda_multipliers: [0.1, 0.31622777, 1.0, 3.16227766, 10.0, 31.6227766, 100.0]
  cv_folds: 3
  pick_1se: true
  max_iterations: 5000
  relative_tolerance: 1.0e-7

state_scoring:
  minimum_state_count: 5
  minimum_inflow: 1.0e-8
  sensitivity_minimum_inflows: [1.0e-8, 1.0e-7, 1.0e-6]
  epsilon: 1.0e-8
  top_k: 5

success:
  median_spearman_minimum: 0.50
  median_spearman_ideal: 0.70
  median_bottleneck_auc_minimum: 0.75
  median_top5_precision_minimum: 0.40
  paired_test_alpha: 0.05

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600
  representative_neutral_states: 10
