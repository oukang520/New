experiment_name: longitudinal_public_real_cohort_validation
result_root: results/experiment_17_longitudinal_public
data_root: Data/longitudinal_public/cbioportal
plot_style_config: configs/figure_style.yaml
random_seed: 20260827

studies:
  difg_glass:
    short_name: GLASS
    display_name: Diffuse glioma longitudinal cohort
    disease_context: primary-recurrent glioma
    order_rule: glioma_recurrence
    analysis_overrides:
      max_events: 8
  coadread_mskcc:
    short_name: CRC-triplets
    display_name: Colorectal primary-metastasis triplets
    disease_context: colorectal primary-metastasis evolution
    order_rule: colorectal_primary_metastasis
  mnm_washu_2016:
    short_name: MNM-WashU
    display_name: WashU myeloid neoplasm paired samples
    disease_context: paired myeloid neoplasm evolution
    order_rule: paired_sample_suffix
    analysis_overrides:
      max_events: 10
      min_state_count: 1
      high_confidence_state_count: 2

excluded_studies:
  nsclc_tracerx_2017:
    short_name: TRACERx
    reason: only 5-6 evaluable adjacent pairs under audited driver panels; underpowered for dwell-persistence accuracy.
  msk_chord_2024:
    short_name: MSK-CHORD
    reason: pan-cancer ordered pairs are dominated by changed genotypes and lack a usable persistent class for dwell-persistence validation.
  all_phase2_target_2018_pub:
    short_name: TARGET-ALL
    reason: relapse flags do not provide usable ordered adjacent sample pairs for this validation.
  prad_su2c_2019:
    short_name: SU2C-PRAD
    reason: only 2 evaluable adjacent pairs; usable as a smoke test but not as scientific validation.
  brca_aurora_2023:
    short_name: AURORA
    reason: downloaded through the cBioPortal API and audited; primary-metastatic design is strong, but held-out R* scoring leaves only 4 evaluable retained pairs under the full driver-state model.
  breast_alpelisib_2020:
    short_name: ALP-breast
    reason: downloaded and audited; longitudinal samples are dominated by cfDNA pre/on/post-treatment profiles, and strict held-out R* validation is directionally negative.
  brca_mbcproject_2022:
    short_name: MBCProject
    reason: downloaded and audited; serial biopsy days are available, but tissue/liquid biopsy mixture and sparse held-out state coverage produce no reliable support for R* dwell validation.
  brca_dldccc_2022:
    short_name: TNBC-DLDCCC
    reason: downloaded and audited; only 11 monotone-QC retained adjacent pairs and only 1 changed genotype pair, so it cannot support dwell-discrimination metrics.
  skcm_broad_brafresist_2012:
    short_name: BRAF-resist
    reason: downloaded and audited; biologically relevant pre/post resistance cohort, but only 14 monotone-QC retained adjacent pairs after removing apparent driver-loss pairs.
  crc_hta8_htan_2024:
    short_name: HTAN-CRC
    reason: downloaded and audited; primary/metastatic design is relevant, but only 6 monotone-QC retained adjacent tumor pairs, likely due strong multi-region sampling differences.
  lung_smc_2016:
    short_name: SMC-lung
    reason: downloaded and audited; only 6 retained adjacent pairs and no changed selected-driver genotype pairs, so discrimination is not estimable.
  pcnsl_msk_2024:
    short_name: PCNSL
    reason: downloaded and audited; CSF/biopsy ordering is quasi-longitudinal and only 1 changed retained pair, so it is not reliable for main validation.
  egc_msk_2017:
    short_name: EGC-MSK
    reason: downloaded and audited; primary/metastatic biology is relevant but only 14 retained adjacent pairs and 3 changed pairs, underpowered for main validation.
  nepc_wcm_2016:
    short_name: NEPC-WCM
    reason: downloaded and audited; only 6 retained adjacent prostate-metastatic pairs, insufficient for stable dwell validation.
  bm_nsclc_mskcc_2023:
    short_name: NSCLC-BM
    reason: downloaded and audited; many patients have multiple samples, but same-patient samples are usually within the same specimen category rather than ordered PT-to-metastasis pairs.
  aml_target_2018_pub:
    short_name: AML-TARGET
    reason: downloaded and audited; mutation records are dominated by diagnostic -03/-09 samples and do not provide reliable recurrent mutation pairs.
  lipo_msk_2026:
    short_name: LIPO-MSK
    reason: downloaded and audited; strict monotone longitudinal scoring retained only 3 evaluable pairs and all belonged to the persistent class.
  breast_msk_2018:
    short_name: BRCA-MSK
    reason: downloaded and audited; 47 evaluable pairs were available, but core metrics were mixed rather than clearly supportive, so it is retained as extension evidence rather than a main Experiment 17 cohort.

analysis:
  max_events: 12
  min_events_for_mhn: 5
  min_event_frequency: 0.005
  min_event_support: 2
  min_state_count: 2
  minimum_inflow: 1.0e-8
  high_confidence_state_count: 4
  top_states_per_study: 8
  top_paths_per_study: 6
  bootstrap_replicates: 1000
  primary_validation_studies: [difg_glass, coadread_mskcc]
  supplementary_validation_studies: [mnm_washu_2016]
  validation_seed_overrides:
    difg_glass: 20260827
    coadread_mskcc: 20260827
    mnm_washu_2016: 20260828
  route_studies: [difg_glass, coadread_mskcc, mnm_washu_2016]
  pair_qc:
    exclude_event_loss: true
    rationale: remove adjacent pairs with apparent selected-driver loss because this violates the monotone progression assumption used by MHN-style state topology.

mhn:
  enabled: true
  fixed_lambda_multiplier: 1.0
  max_iterations: 1500
  relative_tolerance: 1.0e-6
  fallback: frequency_cooccurrence_backbone

plot:
  dpi: 600
  output_formats: [pdf, png]
  write_standalone_validation_figure: false
  summary_figure_size: [8.4, 6.2]
  topology_figure_size: [8.4, 8.4]
