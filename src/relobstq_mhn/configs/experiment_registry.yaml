future_experiment_defaults:
  plot_style_config: configs/figure_style.yaml
  required_outputs:
    - vector_pdf
    - dpi_600_png
    - figure_design_review
    - boundary_check
  figure_policy:
    - choose one primary scientific question per main figure
    - prefer compact annotated matrices for factorial robustness results
    - keep auxiliary diagnostics outside the main figure unless needed for interpretation

main_figures:
  - id: E1_QC_overview
