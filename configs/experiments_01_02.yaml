experiment_root: results/experiments_01_02
plot_style_config: configs/figure_style.yaml
random_seed: 20260624
primary_panel_size: 15
sensitivity_panel_sizes: [10, 15, 20, 25]
minimum_event_samples: 5
minimum_state_count: 5
oncoprint_samples_per_stage: 40

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600

datasets:
  AACR_LUAD:
    display_name: Lung adenocarcinoma
    driver_priority:
      [TP53, KRAS, EGFR, STK11, KEAP1, RBM10, NF1, BRAF, SMARCA4, PIK3CA,
       MET, CDKN2A, ATM, ARID1A, SETD2, KMT2D, PTPRD, MGA, ERBB2, ALK,
       RET, ROS1, NRAS, MAP2K1, U2AF1]
    pathways:
      RTK_RAS: [EGFR, KRAS, NRAS, BRAF, MET, ERBB2, ALK, RET, ROS1, MAP2K1]
      TP53_CELL_CYCLE: [TP53, CDKN2A, RB1, ATM]
      OXIDATIVE_STRESS: [STK11, KEAP1]
      CHROMATIN: [SMARCA4, ARID1A, SETD2, KMT2D]
      RNA_SPLICING: [RBM10, U2AF1]

  AACR_COAD:
    display_name: Colon adenocarcinoma
    driver_priority:
      [APC, TP53, KRAS, PIK3CA, SMAD4, BRAF, FBXW7, SOX9, ARID1A, TCF7L2,
       RNF43, PTEN, CTNNB1, NRAS, ACVR2A, TGFBR2, ATM, ERBB2, POLE, MSH6,
       MLH1, PMS2, AMER1, BRCA2, KMT2D]
    pathways:
      WNT: [APC, CTNNB1, RNF43, TCF7L2, AMER1, SOX9]
      RAS_MAPK: [KRAS, NRAS, BRAF, ERBB2]
      PI3K: [PIK3CA, PTEN]
      TGF_BETA: [SMAD4, TGFBR2, ACVR2A]
      GENOME_MAINTENANCE: [TP53, ATM, POLE, MSH6, MLH1, PMS2, BRCA2]
      CHROMATIN: [ARID1A, KMT2D]

  AACR_IDC:
    display_name: Breast invasive ductal carcinoma
    driver_priority:
      [TP53, PIK3CA, GATA3, MAP3K1, PTEN, ESR1, AKT1, NF1, BRCA1, BRCA2,
       RB1, MAP2K4, CBFB, RUNX1, ATM, KMT2C, ARID1A, KMT2D, FOXA1, SF3B1,
       ERBB2, NCOR1, TBX3, CDH1, NOTCH1]
    pathways:
      PI3K_AKT: [PIK3CA, PTEN, AKT1]
      TP53_CELL_CYCLE: [TP53, RB1, ATM]
      HORMONE_LINEAGE: [GATA3, ESR1, FOXA1, RUNX1, CBFB]
      MAPK: [MAP3K1, MAP2K4, NF1]
      DNA_REPAIR: [BRCA1, BRCA2]
      CHROMATIN: [KMT2C, KMT2D, ARID1A, NCOR1]
