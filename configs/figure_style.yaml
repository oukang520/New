  - name: scientific-visualization
    source: https://github.com/K-Dense-AI/scientific-agent-skills/tree/main/skills/scientific-visualization
    role: Publication-ready scientific figure guardrails, truthful encodings, uncertainty/missing-data policy, rendered-output inspection.
    adopted: design_integrity_rules_and_quality_gates
  - name: matplotlib
    source: https://github.com/K-Dense-AI/scientific-agent-skills/tree/main/skills/matplotlib
    role: Object-oriented Matplotlib layout, GridSpec control, vector/raster export discipline.
    adopted: implementation_guidance
  - name: seaborn
    source: https://github.com/K-Dense-AI/scientific-agent-skills/tree/main/skills/seaborn
    role: Statistical plotting semantics, long-form data, uncertainty display and categorical comparison rules.
    adopted: statistical_plot_guidance
  - name: screenshot
    source: https://github.com/openai/skills/tree/main/skills/.curated/screenshot
    role: Rendered visual inspection support for future turns.
    adopted: installed_for_next_turn
  - name: pdf
    source: https://github.com/openai/skills/tree/main/skills/.curated/pdf
    role: PDF inspection support for future turns.
    adopted: installed_for_next_turn
  - name: jupyter-notebook
    source: https://github.com/openai/skills/tree/main/skills/.curated/jupyter-notebook
    role: Notebook-based exploratory figure iteration support for future turns.
    adopted: installed_for_next_turn

top_journal_sources:
  - title: scIB atlas integration benchmark
    venue: Nature Methods
    year: 2022
    url: https://www.nature.com/articles/s41592-021-01336-8
    design_use: benchmark matrices, compact metric summaries, colorblind-aware encodings
  - title: SCENIC+ multiomic benchmarking
    venue: Nature Methods
    year: 2023
    url: https://www.nature.com/articles/s41592-023-01938-4
    design_use: multi-condition comparison, direct annotations, restrained color hierarchy
  - title: Subclonal reconstruction benchmarking
    venue: Nature Biotechnology
    year: 2024
    url: https://www.nature.com/articles/s41587-024-02250-y
    design_use: benchmark factor organization and performance-summary discipline
  - title: Normalization benchmark of ATAC-seq datasets
    venue: Cell Reports Methods
    year: 2022
    url: https://www.cell.com/cell-reports-methods/fulltext/S2667-2375(22)00211-9
    design_use: method-comparison matrix logic and compact technical comparison
  - title: Pattern benchmarking for AI concept learning
    venue: Patterns
    year: 2023
    url: https://www.cell.com/patterns/fulltext/S2666-3899(23)00143-5
    design_use: high-density benchmark layout and condition grouping
  - title: PMCE cancer evolution simulator
    venue: Bioinformatics
    year: 2022
    url: https://academic.oup.com/bioinformatics/article/38/3/754/6396863
    design_use: cancer-evolution simulation context and reproducible benchmark framing
  - title: Datasets and Benchmarks track
    venue: NeurIPS
    year: 2024
    url: https://neurips.cc/Conferences/2024/CallForDatasetsBenchmarks
    design_use: benchmark reproducibility, dataset/task clarity and transparent evaluation framing

rules:
  - Keep each main figure aligned with one primary scientific question.
  - Prefer one annotated matrix over repeated small panels for factorial robustness experiments.
  - Use color for the primary scalar and a second compact encoding only when it directly supports the same claim.
  - Put auxiliary diagnostics in reports or supplement-style tables unless they are needed to interpret the main claim.
  - Export vector PDF and 600-dpi PNG for every final figure.
  - Run a boundary/cropping check after rendering every final figure.
  - Preserve data transformations, sample sizes, exclusions, missing-value handling and uncertainty definitions in the paired report.
  - Use position on a common scale as the default quantitative encoding; reserve area, node size and color intensity for secondary signals.
  - Do not connect missing observations or convert non-evaluable values to zero unless zero is scientifically meaningful.
  - Use shared axes and near-square panels when cross-cohort comparison is the point of the panel.
  - Avoid distant legends when direct labels or compact in-panel keys can explain the encoding without stealing space.
