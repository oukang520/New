version: 2026-08-28
name: rel_obstq_mhn_top_journal_figure_style

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600
  output_formats: [pdf, png]
  bbox_inches: tight
  pad_inches: 0.04
  rcparams:
    axes.titlesize: 9.5
    axes.labelsize: 8
    xtick.labelsize: 7
    ytick.labelsize: 7
    legend.fontsize: 7
    figure.titlesize: 11
    axes.linewidth: 0.7
    axes.titleweight: normal
    axes.labelcolor: "#263238"
    axes.edgecolor: "#333333"
    lines.linewidth: 1.0
    lines.markersize: 3.6
    xtick.major.width: 0.7
    ytick.major.width: 0.7
    xtick.major.size: 3
    ytick.major.size: 3
    xtick.direction: out
    ytick.direction: out
    xtick.color: "#333333"
    ytick.color: "#333333"
    text.color: "#263238"
    grid.color: "#E6E6E6"
    grid.linewidth: 0.5
    legend.handlelength: 1.1
    legend.handletextpad: 0.35
    legend.borderpad: 0.2
    legend.labelspacing: 0.25
    pdf.fonttype: 42
    ps.fonttype: 42
    savefig.facecolor: white
    figure.facecolor: white
    axes.facecolor: white
    axes.spines.top: false
    axes.spines.right: false
    legend.frameon: false
    image.interpolation: nearest

colors:
  text:
    primary: "#263238"
    secondary: "#4E5A5E"
    grid: "#E6E6E6"
    divider: "#333333"
  selected_palette:
    name: user_pastel_top_journal
    source: user_provided_reference
    colors:
      lavender: "#B5AED5"
      sky_blue: "#B2E6FD"
      sage: "#B8D2CC"
      coral: "#E8B2A7"
      pale_yellow: "#FEEBB9"
  categorical:
    lavender: "#B5AED5"
    sky_blue: "#B2E6FD"
    sage: "#B8D2CC"
    coral: "#E8B2A7"
    pale_yellow: "#FEEBB9"
  continuous:
    dwell_rank: ["#FEEBB9", "#B8D2CC", "#B2E6FD", "#B5AED5"]
    delta_gain: ["#E8B2A7", "#FEEBB9", "#B8D2CC", "#B2E6FD"]
    positive: ["#FEEBB9", "#B8D2CC", "#B2E6FD"]
    diverging: ["#E8B2A7", "#FEEBB9", "#B2E6FD"]

layout:
  journal_contract:
    target: Nature/Cell/Bioinformatics-style scientific figures
    primary_medium: manuscript
    preferred_panel_aspect: square_or_near_square_when_scientifically_compatible
    figure_width_policy: use compact one-column or 1.5-column figures unless a topology/map needs more horizontal room
    table_policy: use compact tables for exact metrics and uncertainty when graphics would reduce interpretability
    evidence_policy: preserve raw tables, explicit missing values, seeds, transformations and uncertainty definitions
  geometry:
    single_panel_width_mm: 89
    double_panel_width_mm: 183
    preferred_panel_aspect_min: 0.78
    preferred_panel_aspect_max: 1.28
    min_axis_label_margin_pt: 4
    max_legend_fraction: 0.16
  preferred:
    matrix: one compact matrix for factorial robustness results
    small_multiples: only when each facet adds a distinct scientific question
    table: use for exact uncertainty or audit values, not for primary visual emphasis
    embedded_scale_keys: compact in-panel or near-panel legends instead of distant color bars when values are directly annotated
    contextual_insets: small boxed insets only when they explain a mechanism, variable definition or phase boundary
  avoid:
    - redundant panels that repeat the same scientific message
    - decorative gradients or background objects
    - threshold lines when thresholds are empirical references rather than formal claims
    - low-information legends when direct annotation is possible
    - importing reference-figure color palettes when the project palette is already fixed

annotation:
  direct_cell_values: true
  prefer_delta_not_gain_word: true
  use_math_symbols_for_primary_metrics: true
  max_main_panel_endpoints: 2
  abbreviate_repeated_labels: true
  panel_letters:
    style: small_bold_outside_data_region
    font_size: 10
    x_offset: -0.14
    y_offset: 1.04

quality_gates:
  rendered_png:
    min_width_px: 1400
    min_height_px: 1000
    min_content_fraction: 0.012
    max_edge_ink_fraction: 0.18
    border_scan_fraction: 0.012
    flag_aspect_ratio_below: 0.45
    flag_aspect_ratio_above: 4.20
  export:
    required_formats: [pdf, png]
    png_dpi: 600
    background: white
    vector_fonttype:
      pdf.fonttype: 42
      ps.fonttype: 42

reference_design_patterns:
  source: user_provided_reference_figures_and_github_skill_review
  color_policy: extract_layout_and_annotation_logic_only; do_not_extract_colors
  patterns:
    - name: embedded_micro_legends
      use: Place compact scale keys or legends inside the figure's unused top/right area when direct numeric labels already carry exact values.
      suitable_for: dense matrices, line panels and compact benchmark summaries
    - name: direct_in_panel_annotation
      use: Annotate the main comparison, effect direction or exceptional condition directly inside the plotting area instead of relying on long legends.
      suitable_for: single-message panels and mechanism-linked measurements
    - name: boxed_context_insets
      use: Add small boxed mechanism or variable-definition insets only when they reduce ambiguity about what a metric means.
      suitable_for: mechanistic figures and conceptual method panels
    - name: shared_axis_small_multiples
      use: Use aligned small multiples with shared axes when separate panels represent different variables or experimental conditions.
      suitable_for: multi-condition benchmarks and comparative validation
    - name: summary_with_raw_points
      use: Overlay raw points on bars or summary intervals when replicate-level evidence is part of the claim.
      suitable_for: replicate experiments and uncertainty-aware summaries
    - name: phase_bands_and_arrows
      use: Use shaded bands, arrows or bracketed windows to mark process stages when the x-axis has an ordered temporal or procedural meaning.
      suitable_for: time-series, trajectory and intervention-stage figures
    - name: uncertainty_bands
      use: Pair fitted trends with transparent uncertainty bands when modeling a continuous relationship.
      suitable_for: regression and sensitivity analyses
    - name: compact_panel_letters
      use: Keep panel letters small, bold and outside the data region; avoid extra title text when axes already explain the content.
      suitable_for: multi-panel composite figures
    - name: metric_table_panel
      use: Replace cluttered bar/point summaries with a compact table when the exact value and criterion are the main evidence.
      suitable_for: validation matrices, audit metrics and uncertainty summaries
    - name: ranked_forest_panel
      use: Use horizontal intervals with a zero/reference line for effect estimates so direction, uncertainty and cohort identity are read on one common scale.
      suitable_for: effect-size comparison, correlation summaries and cross-cohort validation
    - name: compact_trajectory_strip
      use: Use short aligned topology or trajectory strips with direct terminal labels when route order matters more than full network geometry.
      suitable_for: real-state progression paths and relative dwell-time route illustrations

