experiment_name: ablation_and_backbone_replacement
result_root: results/experiment_14_ablation_backbone
plot_style_config: configs/figure_style.yaml
experiment_ready_root: processed/experiment_ready
experiment_03_root: results/experiment_03_mhn_interface
experiment_04_root: results/experiment_04_relative_inflow
experiment_05_root: results/experiment_05_state_scores
experiment_06_root: results/experiment_06_bottleneck_recovery_enhanced
experiment_12_root: results/experiment_12_clinical_validation

analysis:
  top_k: 10
  split_repeats: 50
  split_fraction: 0.5
  minimum_state_count: 5
  high_confidence_state_count: 10
  minimum_inflow: 1.0e-6
  epsilon: 1.0e-6
  minimum_events_for_cox: 20
  random_seed: 20260628
  panel_size: 15

variants:
  full_mhn:
    display_name: Full R*
    mechanism: L_v divided by MHN-derived F_hat
  occupancy_only:
    display_name: Occupancy
    mechanism: L_v only
  uniform_inflow:
    display_name: Uniform
    mechanism: L_v divided by same-stage one-step uniform inflow
  frequency_inflow:
    display_name: Frequency
    mechanism: L_v divided by event-frequency weighted inflow
  shuffled_mhn:
    display_name: Shuffled
    mechanism: L_v divided by permuted MHN edge probabilities

datasets:
  AACR_LUAD:
    display_name: Lung adenocarcinoma
    short_name: LUAD
  AACR_COAD:
    display_name: Colon adenocarcinoma
    short_name: COAD
  AACR_IDC:
    display_name: Breast invasive ductal carcinoma
    short_name: IDC

plot:
  font_family: Arial
  base_font_size: 8
  dpi: 600
