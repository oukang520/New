   <g id="text_12">
    <text style="font: 7.5px 'Arial'" transform="translate(26.11987 208.664014)">Train: environment → selection</text>
    <text style="font: 7.5px 'Arial'" transform="translate(25.976316 217.93876)">→ three-event observed record</text>
   </g>
   <g id="text_13">
    <text style="font: 7.5px 'Arial'" transform="translate(179.846911 208.664014)">Calibration: 80 X + S</text>
    <text style="font: 7.5px 'Arial'" transform="translate(162.655504 217.93876)">Same information for baselines</text>
   </g>
   <g id="text_14">
    <text style="font: 7.5px 'Arial'" transform="translate(314.406003 208.620069)">Estimator sees observed inputs only</text>
    <text style="font: 7.5px 'Arial'" transform="translate(310.862253 217.982705)">Frozen methods → held-out prediction</text>
   </g>
