[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-evam"
version = "0.1.0"
description = "Identifiability, reliable inference and data acquisition for biased cancer observations"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "scipy==1.13.1", "pandas==2.3.3", "matplotlib==3.9.4"]

[project.optional-dependencies]
research = ["scikit-learn==1.6.1", "openpyxl==3.1.5", "requests==2.32.5", "lifelines==0.30.0", "rdata==0.11.2", "pypdf==6.19.0", "PyMuPDF==1.26.5"]
test = ["pytest==8.4.2"]
official-mhn = ["mhn==1.2.2"]
parquet = ["pyarrow"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["invariant_evam*", "phase2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
